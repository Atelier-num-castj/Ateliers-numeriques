<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Utiliser la molette</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./molette.css" />
    <link
      rel="shortcut icon"
      href="../../assets/logo-CASTJ.png"
      type="image/x-icon"
    />
    <script type="module" src="./molette.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../assets/Logo-CASTJ-blanc.png"
        alt="Logo du centre d'animation"
      />
      <div class="header-title">
        <h1>Centre d'animation Saint Jean</h1>
        <h2>Découvrir l'ordinateur</h2>
      </div>
      <div class="bas-header">
        <nav>
          <ul>
            <li>
              <a href="../../index.html" class="bouton">Retour à l'accueil</a>
            </li>
            <li>
              <a href="../index.html" class="bouton">Retour à l'atelier</a>
            </li>
          </ul>
        </nav>
        <h3>Utiliser la molette</h3>
      </div>
    </header>

    <!-- data-niveau donne la couleur du niveau en cours (molette.css, section 1).
         molette.js le change quand on change de niveau. -->
    <main class="molette" id="molette" data-niveau="page">
      <div class="instructions">
        <h3 class="sous-titre">Apprendre à utiliser la molette</h3>
        <div class="trait"></div>
      </div>

      <!-- Les niveaux : créés par molette.js -->
      <ol class="niveaux" id="niveaux" aria-label="Les niveaux"></ol>

      <!-- L'explication du niveau : même carte repliable que « Cliquer » -->
      <details class="explication" open>
        <summary>
          <!-- La souris : les deux boutons restent gris,
               seule la molette prend la couleur du niveau -->
          <svg class="souris" viewBox="0 0 86 120" aria-hidden="true">
            <rect
              class="souris-corps"
              x="6"
              y="6"
              width="74"
              height="108"
              rx="37"
            />
            <path class="souris-gauche" d="M6 46V43a37 37 0 0 1 37-37v40z" />
            <path class="souris-droit" d="M80 46V43A37 37 0 0 0 43 6v40z" />
            <rect
              class="souris-molette"
              x="36"
              y="16"
              width="14"
              height="26"
              rx="7"
            />
          </svg>
          <h4 id="consigne-titre"></h4>
          <span class="consigne-texte" id="consigne-texte"></span>
          <span class="replier"></span>
        </summary>

        <div class="explication-detail">
          <h5>À quoi ça sert ?</h5>
          <ul class="usages" id="usages"></ul>
          <p class="astuce">
            <strong>💡 Astuce :</strong> <span id="astuce"></span>
          </p>
          <p class="mobile" id="mobile"></p>
        </div>
      </details>

      <!-- Le plateau de jeu -->
      <section class="plateau" id="plateau">
        <div class="barre-manche">
          <p id="manche"></p>
          <p id="etape"></p>
        </div>

        <!-- La consigne courte de l'exercice, bien visible au-dessus du jeu
             (niveau 2) : remplie par molette.js -->
        <p class="objectif" id="objectif" hidden></p>

        <!-- La zone de jeu : l'écran entre deux manches,
             ou le décor de la manche en cours (scène) -->
        <div class="zone" id="zone">
          <div class="ecran" id="ecran">
            <h3 id="ecran-titre"></h3>
            <p id="ecran-texte"></p>
            <div class="ecran-boutons">
              <button type="button" class="bouton" id="ecran-bouton"></button>
              <!-- Lien vers l'activité suivante : affiché seulement à la fin du jeu -->
              <a
                class="bouton"
                id="activite-suivante"
                href="../copier_coller/intro.html"
                hidden
                >Activité suivante →</a
              >
            </div>
          </div>
          <div id="scene"></div>
        </div>

        <!-- Le guide du niveau 1 : il reste collé en bas de l'écran
             pendant qu'on fait défiler la page -->
        <p class="guide" id="guide" hidden>
          <span class="guide-fleche" id="guide-fleche" aria-hidden="true"></span>
          <span id="guide-texte"></span>
        </p>

        <p class="message" id="message" role="status"></p>
      </section>

      <!-- La fenêtre « Bravo », à la fin de chaque exercice
           (comme dans « Déplacer la souris »). molette.js l'ouvre avec showModal(). -->
      <dialog class="bravo" id="bravo" aria-labelledby="bravo-titre">
        <h3 id="bravo-titre">Bravo ! 🎉</h3>
        <p id="bravo-texte"></p>
        <button type="button" class="bouton" id="bravo-bouton"></button>
      </dialog>
    </main>

    <!-- =====================================================
         Les décors des manches.
         Un <template> n'est pas affiché : molette.js en fait
         une copie (cloneNode) au début de chaque manche.
         ===================================================== -->

    <!-- Les dessins du coffre et de l'arbre, réutilisés avec <use> -->
    <svg hidden>
      <symbol id="dessin-coffre" viewBox="0 0 120 96">
        <rect x="10" y="40" width="100" height="50" rx="6" fill="#a0632b" stroke="#16213e" stroke-width="4" />
        <path d="M10 44 V30 a50 24 0 0 1 100 0 V44 Z" fill="#c07a36" stroke="#16213e" stroke-width="4" />
        <rect x="52" y="38" width="16" height="22" rx="3" fill="#f2c13a" stroke="#16213e" stroke-width="3" />
        <rect x="12" y="62" width="96" height="6" fill="#f2c13a" />
      </symbol>
      <symbol id="dessin-arbre" viewBox="0 0 60 80">
        <rect x="25" y="48" width="10" height="30" fill="#7a5230" />
        <circle cx="30" cy="30" r="28" fill="#4f9a5a" />
      </symbol>
    </svg>

    <!-- Niveau 1, manche 1 : le chemin du trésor -->
    <template id="scene-tresor">
      <div class="scene chemin">
        <!-- Le chemin : le même tracé, en sable puis en pointillés.
             preserveAspectRatio="none" : le dessin s'étire à la largeur du plateau -->
        <svg
          class="trace"
          viewBox="0 0 868 2400"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            class="trace-sable"
            d="M190 200 C 190 500, 680 520, 660 750 S 160 1000, 210 1250 S 700 1500, 650 1750 S 250 2000, 540 2240"
          />
          <path
            class="trace-pointilles"
            d="M190 200 C 190 500, 680 520, 660 750 S 160 1000, 210 1250 S 700 1500, 650 1750 S 250 2000, 540 2240"
          />
        </svg>

        <!-- Les arbres : --x et --y donnent leur place (molette.css) -->
        <svg class="arbre" style="--x: 88%; --y: 420px" aria-hidden="true"><use href="#dessin-arbre" /></svg>
        <svg class="arbre" style="--x: 9%; --y: 820px" aria-hidden="true"><use href="#dessin-arbre" /></svg>
        <svg class="arbre" style="--x: 90%; --y: 1150px" aria-hidden="true"><use href="#dessin-arbre" /></svg>
        <svg class="arbre" style="--x: 12%; --y: 1580px" aria-hidden="true"><use href="#dessin-arbre" /></svg>
        <svg class="arbre" style="--x: 88%; --y: 1960px" aria-hidden="true"><use href="#dessin-arbre" /></svg>
        <svg class="arbre" style="--x: 14%; --y: 2250px" aria-hidden="true"><use href="#dessin-arbre" /></svg>

        <!-- La maison : le départ et l'arrivée -->
        <svg class="objet maison" viewBox="0 0 120 110" role="img" aria-label="La maison">
          <path d="M10 52 L60 10 L110 52" fill="#c9382a" stroke="#16213e" stroke-width="4" stroke-linejoin="round" />
          <rect x="22" y="50" width="76" height="54" fill="#fff6e3" stroke="#16213e" stroke-width="4" />
          <rect x="52" y="70" width="18" height="34" fill="#2378b4" stroke="#16213e" stroke-width="3" />
          <rect x="30" y="62" width="16" height="16" fill="#cfe8fa" stroke="#16213e" stroke-width="3" />
          <rect x="76" y="62" width="16" height="16" fill="#cfe8fa" stroke="#16213e" stroke-width="3" />
        </svg>

        <!-- Le trésor, tout en bas -->
        <button type="button" class="objet tresor" aria-label="Le trésor">
          <svg viewBox="0 0 120 96" aria-hidden="true"><use href="#dessin-coffre" /></svg>
        </button>
      </div>
    </template>

    <!-- Niveau 1, manche 2 : la fusée, de la Terre à la Lune -->
    <template id="scene-fusee">
      <div class="scene espace">
        <!-- La Lune, tout en haut -->
        <svg class="objet lune" viewBox="0 0 160 160" role="img" aria-label="La Lune">
          <circle cx="80" cy="80" r="74" fill="#f4f1de" stroke="#c9c3a3" stroke-width="4" />
          <circle cx="55" cy="60" r="14" fill="#e2dcc0" />
          <circle cx="102" cy="48" r="9" fill="#e2dcc0" />
          <circle cx="98" cy="104" r="18" fill="#e2dcc0" />
          <circle cx="50" cy="112" r="8" fill="#e2dcc0" />
        </svg>

        <!-- La piste de la fusée : toute la hauteur du décor.
             La fusée y est « collante » (position: sticky) :
             elle reste à 150 px du bas de l'écran pendant qu'on fait défiler. -->
        <div class="piste">
          <svg class="fusee" viewBox="0 0 80 170" role="img" aria-label="La fusée">
            <g class="flamme">
              <path d="M28 132 Q40 170 52 132 Z" fill="#f18d20" />
              <path d="M33 132 Q40 155 47 132 Z" fill="#ffd54a" />
            </g>
            <path d="M12 104 L26 84 V128 H12 Z" fill="#c9382a" stroke="#16213e" stroke-width="3" stroke-linejoin="round" />
            <path d="M68 104 L54 84 V128 H68 Z" fill="#c9382a" stroke="#16213e" stroke-width="3" stroke-linejoin="round" />
            <path d="M40 4 C 62 26, 58 90, 54 132 H26 C 22 90, 18 26, 40 4 Z" fill="#ffffff" stroke="#16213e" stroke-width="3" />
            <path d="M40 4 C 50 14, 54 26, 55 36 H25 C 26 26, 30 14, 40 4 Z" fill="#c9382a" stroke="#16213e" stroke-width="3" />
            <circle cx="40" cy="62" r="11" fill="#cfe8fa" stroke="#16213e" stroke-width="3" />
          </svg>
        </div>

        <!-- La Terre : de l'herbe et la rampe de lancement -->
        <svg class="sol" viewBox="0 0 868 240" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 70 C 200 20, 400 90, 600 50 S 800 40, 868 60 V240 H0 Z" fill="#a9d8ad" />
          <path d="M0 120 C 250 80, 500 150, 868 100 V240 H0 Z" fill="#8fcb95" />
          <rect x="300" y="78" width="268" height="14" rx="4" fill="#5d6877" />
        </svg>
      </div>
    </template>

    <!-- Niveau 2, manche 1 : le répertoire du téléphone.
         Les contacts sont ajoutés par molette.js (liste CONTACTS). -->
    <template id="scene-contacts">
      <div class="scene cadre">
        <p class="cadre-entete">
          <span class="cadre-titre">Contacts</span>
        </p>
        <!-- tabindex="0" : on peut aussi faire défiler la liste au clavier -->
        <div class="defilant repertoire" tabindex="0" aria-label="Liste des contacts"></div>
      </div>
    </template>

    <!-- Niveau 2, manche 2 : une conversation.
         Les messages sont ajoutés par molette.js (liste MESSAGES). -->
    <template id="scene-messages">
      <div class="scene cadre">
        <p class="cadre-entete">
          <span class="avatar" aria-hidden="true">N</span>
          <span class="cadre-titre">Nadia</span>
        </p>
        <div class="defilant fil" tabindex="0" aria-label="Conversation avec Nadia"></div>
      </div>
    </template>

    <!-- Niveau 3, manche 1 : une page de résultats de recherche.
         Elle ressemble à un vrai moteur de recherche, avec un nom inventé
         (« Cherchetout ») : on ne copie pas la marque d'une vraie entreprise.
         Les titres des résultats sont des <button> : on peut cliquer dessus,
         mais la page ne change pas d'adresse. -->
    <template id="scene-recherche">
      <div class="scene page-web">
        <!-- La fenêtre du navigateur : la barre reste collée en haut de l'écran -->
        <div class="navigateur" aria-hidden="true">
          <span class="onglet"><span class="onglet-icone"></span>recette des crêpes - Cherchetout</span>
          <div class="barre-adresse">
            <span class="fleches">← → ↻</span>
            <span class="adresse">cherchetout.fr/recherche?q=recette+des+crêpes</span>
          </div>
        </div>

        <div class="recherche-entete">
          <span class="logo-recherche">Cherche<span>tout</span></span>
          <span class="champ-recherche">recette des crêpes</span>
        </div>
        <div class="onglets-recherche" aria-hidden="true">
          <span class="choisi">Tous</span><span>Images</span><span>Vidéos</span><span>Actualités</span><span>Plus</span>
        </div>

        <div class="resultats">
          <p class="nombre-resultats">Environ 1 230 000 résultats</p>

          <!-- La réponse écrite par une intelligence artificielle (IA),
               tout en haut, comme sur beaucoup de moteurs de recherche -->
          <div class="reponse-ia">
            <p class="ia-titre">✨ Réponse de l'IA</p>
            <p>
              Pour faire des crêpes, il faut <strong>250 g de farine</strong>,
              <strong>4 œufs</strong> et <strong>50 cl de lait</strong>.
              Mélange la farine et les œufs, puis ajoute le lait petit à petit.
              Fais cuire chaque crêpe 1 minute de chaque côté, dans une poêle
              chaude.
            </p>
            <p class="ia-attention">L'IA peut se tromper. Vérifie sur les sites.</p>
          </div>

          <div class="resultat">
            <p class="site"><span class="site-icone">🍳</span><span>Recettes faciles<small>https://www.recettes-faciles.fr › crepes</small></span></p>
            <button type="button" class="resultat-titre">Pâte à crêpes rapide en 10 minutes</button>
            <p class="resume">La pâte à crêpes la plus simple : de la farine, des œufs, du lait. Prête en 10 minutes, sans repos.</p>
          </div>

          <!-- La bande d'images -->
          <p class="titre-bloc">Images</p>
          <div class="images-recherche">
            <img src="../../assets/faux_google/crepes_2.webp" alt="Des crêpes avec des fruits rouges" />
            <img src="../../assets/faux_google/crepes_3.webp" alt="Une pile de crêpes" />
            <img src="../../assets/faux_google/crepes_4.webp" alt="Des crêpes et de la pâte à tartiner" />
            <img src="../../assets/faux_google/crepes_5.webp" alt="Des crêpes épaisses" />
          </div>

          <!-- Les questions se déplient comme sur un vrai moteur de recherche :
               <details> et <summary> le font tout seuls, sans JavaScript -->
          <div class="questions">
            <p class="titre-bloc">Autres questions posées</p>
            <details>
              <summary>Quelle farine pour les crêpes ?</summary>
              <p>La farine de blé classique (type 45 ou 55) convient très bien.</p>
            </details>
            <details>
              <summary>Faut-il laisser reposer la pâte ?</summary>
              <p>
                Ce n'est pas obligatoire, mais une heure de repos rend les
                crêpes plus moelleuses.
              </p>
            </details>
            <details>
              <summary>Combien de crêpes avec 250 g de farine ?</summary>
              <p>Environ 12 à 15 crêpes, selon la taille de la poêle.</p>
            </details>
          </div>

          <div class="resultat">
            <p class="site"><span class="site-icone">📺</span><span>Cuisine TV<small>https://www.cuisine-tv.fr › video</small></span></p>
            <button type="button" class="resultat-titre">Vidéo : réussir ses crêpes comme un chef</button>
            <p class="resume">Regardez notre vidéo pas à pas pour des crêpes fines et dorées.</p>
          </div>

          <div class="resultat">
            <p class="site"><span class="site-icone">🌍</span><span>Recettes du monde<small>https://www.recettes-du-monde.fr › bretagne</small></span></p>
            <button type="button" class="resultat-titre">Les crêpes bretonnes traditionnelles</button>
            <p class="resume">Découvrez l'histoire des crêpes en Bretagne et la recette des galettes.</p>
          </div>

          <!-- Le résultat à trouver -->
          <div class="resultat avec-photo">
            <div>
              <p class="site"><span class="site-icone">👵</span><span>La cuisine de Mamie<small>https://www.lacuisinedemamie.fr › crepes</small></span></p>
              <button type="button" class="resultat-titre cible">Les crêpes de Mamie, la recette facile</button>
              <p class="resume">Ma recette de crêpes, simple et inratable, pour 4 personnes.</p>
            </div>
            <img src="../../assets/faux_google/crepes_1.webp" alt="" />
          </div>
        </div>
      </div>
    </template>

    <!-- Niveau 3, manche 2 : la page de la recette
         (celle sur laquelle on arrive en cliquant sur le résultat) -->
    <template id="scene-recette">
      <div class="scene page-web recette">
        <div class="navigateur" aria-hidden="true">
          <span class="onglet"><span class="onglet-icone"></span>Les crêpes de Mamie</span>
          <div class="barre-adresse">
            <span class="fleches">← → ↻</span>
            <span class="adresse">lacuisinedemamie.fr/crepes</span>
          </div>
        </div>

        <p class="recette-site">👵 La cuisine de Mamie</p>

        <div class="recette-page">
          <p class="recette-titre">Les crêpes de Mamie</p>
          <p class="recette-infos">
            <span>👥 4 personnes</span><span>⏱️ 10 min</span><span>🔥 20 min</span>
          </p>
          <img
            class="recette-photo"
            src="../../assets/faux_google/crepes_1.webp"
            alt="Une pile de crêpes"
          />
          <p class="recette-intro">
            Les crêpes, c'est la recette de mon enfance. Voici ma recette
            simple, pour un goûter en famille.
          </p>
          <p class="recette-intro">
            Le petit secret de Mamie : laisse reposer la pâte une heure.
            Les crêpes seront encore meilleures !
          </p>

          <p class="recette-section">Ingrédients</p>
          <ul class="ingredients">
            <li>250 g de farine</li>
            <li>4 œufs</li>
            <li>50 cl de lait</li>
            <li>1 pincée de sel</li>
            <li>2 cuillères de sucre</li>
            <li>50 g de beurre fondu</li>
          </ul>

          <p class="recette-section">Préparation</p>
          <!-- Les étapes sont des boutons : on peut cliquer dessus.
               La dernière est celle à trouver (classe « cible »). -->
          <ol class="etapes-recette">
            <li><button type="button">Mets la farine dans un grand saladier.</button></li>
            <li><button type="button">Fais un trou au milieu de la farine.</button></li>
            <li><button type="button">Casse les œufs dans le trou.</button></li>
            <li><button type="button">Mélange doucement avec un fouet.</button></li>
            <li><button type="button">Verse le lait petit à petit, sans arrêter de mélanger.</button></li>
            <li><button type="button">Ajoute le sel, le sucre et le beurre fondu.</button></li>
            <li><button type="button">Laisse reposer la pâte une heure.</button></li>
            <li><button type="button">Fais chauffer une poêle avec un peu de beurre.</button></li>
            <li><button type="button">Verse une petite louche de pâte dans la poêle.</button></li>
            <li><button type="button">Fais cuire 1 minute, puis retourne la crêpe.</button></li>
            <li><button type="button">Fais cuire encore 1 minute de l'autre côté.</button></li>
            <li><button type="button" class="cible">Régale-toi en mangeant les crêpes ! 😋</button></li>
          </ol>

          <p class="recette-section">Vos photos</p>
          <div class="recette-galerie">
            <img src="../../assets/faux_google/crepes_2.webp" alt="" />
            <img src="../../assets/faux_google/crepes_3.webp" alt="" />
            <img src="../../assets/faux_google/crepes_4.webp" alt="" />
            <img src="../../assets/faux_google/crepes_5.webp" alt="" />
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
