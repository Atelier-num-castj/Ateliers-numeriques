<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apprendre à cliquer</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="./clic.css" />
    <link
      rel="shortcut icon"
      href="../../assets/logo-CASTJ.png"
      type="image/x-icon"
    />
    <script type="module" src="./clic.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../assets/Logo-CASTJ-blanc.png"
        alt="Logo du centre d'animation"
      />
      <div class="header-title">
        <h1>Centre d'animation Saint Jean</h1>
        <h2>Découvrir l'ordinateur</h2>
      </div>
      <div class="bas-header">
        <nav>
          <ul>
            <li>
              <a href="../../index.html" class="bouton">Retour à l'accueil</a>
            </li>
            <li>
              <a href="../index.html" class="bouton">Retour à l'atelier</a>
            </li>
          </ul>
        </nav>
        <h3>Cliquer avec la souris</h3>
      </div>
    </header>

    <main class="clic">
      <div class="instructions">
        <h3 class="sous-titre">Apprendre à cliquer</h3>
        <div class="trait"></div>
      </div>

      <!-- Les 4 niveaux (Clic gauche, Clic droit…) : créés par clic.js -->
      <ol class="niveaux" id="niveaux" aria-label="Les niveaux"></ol>

      <!-- La consigne du niveau, avec le dessin de la souris -->
      <div class="consigne">
        <!-- data-bouton dit quel bouton colorier : gauche, droit, double ou melange -->
        <svg
          class="souris"
          id="souris"
          data-bouton="gauche"
          viewBox="0 0 86 120"
          aria-hidden="true"
        >
          <rect
            class="souris-corps"
            x="6"
            y="6"
            width="74"
            height="108"
            rx="37"
          />
          <path class="souris-gauche" d="M6 46V43a37 37 0 0 1 37-37v40z" />
          <path class="souris-droit" d="M80 46V43A37 37 0 0 0 43 6v40z" />
          <text class="souris-x2" x="16" y="35">×2</text>
        </svg>
        <div>
          <h4 id="consigne-titre"></h4>
          <p id="consigne-texte"></p>
        </div>
      </div>

      <!-- Le plateau de jeu -->
      <section class="plateau">
        <div class="barre-manche">
          <p id="manche"></p>
          <p id="compteur"></p>
        </div>

        <!-- La zone où apparaissent les cibles -->
        <div class="zone" id="zone">
          <!-- L'écran affiché entre deux manches (début, fin…) -->
          <div class="ecran" id="ecran">
            <h3 id="ecran-titre"></h3>
            <p id="ecran-texte"></p>
            <button type="button" class="bouton" id="ecran-bouton"></button>
          </div>
        </div>

        <p class="message" id="message" role="status"></p>
      </section>
    </main>

    <!-- Modèle de petite souris, copié par clic.js dans les cibles du Mélange.
         Un <template> n'est jamais affiché : c'est un « moule » pour le JS. -->
    <template id="modele-souris">
      <svg class="souris" viewBox="0 0 86 120" aria-hidden="true">
        <rect
          class="souris-corps"
          x="6"
          y="6"
          width="74"
          height="108"
          rx="37"
        />
        <path class="souris-gauche" d="M6 46V43a37 37 0 0 1 37-37v40z" />
        <path class="souris-droit" d="M80 46V43A37 37 0 0 0 43 6v40z" />
        <text class="souris-x2" x="16" y="35">×2</text>
      </svg>
    </template>
  </body>
</html>
