<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apprendre à cliquer</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="./clic.css" />
    <link
      rel="shortcut icon"
      href="../../assets/logo-CASTJ.png"
      type="image/x-icon"
    />
    <script type="module" src="./clic.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../assets/Logo-CASTJ-blanc.png"
        alt="Logo du centre d'animation"
      />
      <div class="header-title">
        <h1>Centre d'animation Saint Jean</h1>
        <h2>Découvrir l'ordinateur</h2>
      </div>
      <div class="bas-header">
        <nav>
          <ul>
            <li>
              <a href="../../index.html" class="bouton">Retour à l'accueil</a>
            </li>
            <li>
              <a href="../index.html" class="bouton">Retour à l'atelier</a>
            </li>
          </ul>
        </nav>
        <h3>Cliquer avec la souris</h3>
      </div>
    </header>

    <main class="clic">
      <div class="instructions">
        <h3 class="sous-titre">Apprendre à cliquer</h3>
        <div class="trait"></div>
      </div>

      <!-- Les niveaux (Clic gauche, Clic droit, Double clic) : créés par clic.js -->
      <ol class="niveaux" id="niveaux" aria-label="Les niveaux"></ol>

      <!-- L'explication du niveau.
           <details> se replie et se déplie tout seul, sans JS.
           « open » = déplié au chargement de la page. -->
      <details class="explication" open>
        <!-- <summary> : la partie TOUJOURS visible, même repliée.
             Cliquer dessus replie ou déplie le reste. -->
        <summary>
          <!-- data-bouton dit quel bouton colorier : gauche, droit ou double -->
          <svg
            class="souris"
            id="souris"
            data-bouton="gauche"
            viewBox="0 0 86 120"
            aria-hidden="true"
          >
            <rect
              class="souris-corps"
              x="6"
              y="6"
              width="74"
              height="108"
              rx="37"
            />
            <path class="souris-gauche" d="M6 46V43a37 37 0 0 1 37-37v40z" />
            <path class="souris-droit" d="M80 46V43A37 37 0 0 0 43 6v40z" />
            <text class="souris-x2" x="16" y="35">×2</text>
          </svg>
          <h4 id="consigne-titre"></h4>
          <span class="consigne-texte" id="consigne-texte"></span>
          <span class="replier"></span>
        </summary>

        <!-- La partie qui se replie -->
        <div class="explication-detail">
          <h5>À quoi ça sert ?</h5>
          <ul class="usages" id="usages"></ul>
          <p class="astuce">
            <strong>💡 Astuce :</strong> <span id="astuce"></span>
          </p>
        </div>
      </details>

      <!-- Le plateau de jeu -->
      <section class="plateau">
        <div class="barre-manche">
          <p id="manche"></p>
          <p id="compteur"></p>
        </div>

        <!-- La zone où apparaissent les cibles -->
        <div class="zone" id="zone">
          <!-- L'écran affiché entre deux manches (début, fin…) -->
          <div class="ecran" id="ecran">
            <h3 id="ecran-titre"></h3>
            <p id="ecran-texte"></p>

            <!-- Le récapitulatif des 3 clics : affiché seulement à la fin du jeu -->
            <ul class="recap" id="recap" hidden></ul>

            <div class="ecran-boutons">
              <button type="button" class="bouton" id="ecran-bouton"></button>
              <!-- Lien vers l'activité suivante : affiché seulement à la fin du jeu -->
              <a
                class="bouton"
                id="activite-suivante"
                href="../deplacer_souris/deplacer.html"
                hidden
                >Activité suivante →</a
              >
            </div>
          </div>
        </div>

        <p class="message" id="message" role="status"></p>
      </section>
    </main>
  </body>
</html>
