<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les sons</title>
    <link rel="stylesheet" href="../../../styles.css" />
    <link rel="stylesheet" href="../../styles.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/logo-CASTJ.png"
      type="image/x-icon"
    />
    <script src="sons.js" defer></script>
  </head>
  <body>
    <header>
      <img
        src="../../../assets/Logo-CASTJ-blanc.png"
        alt="Logo du centre d'animation"
      />
      <div class="header-title">
        <h1>Centre d'animation Saint Jean</h1>
        <h2>AlphaNum</h2>
      </div>
      <div class="bas-header">
        <nav>
          <ul>
            <li>
              <a href="../../../index.html" class="bouton"
                >Retour à l'accueil</a
              >
            </li>
            <li>
              <a href="../../index.html" class="bouton">Retour à l'atelier</a>
            </li>
          </ul>
        </nav>
        <h3>Les sons</h3>
      </div>
    </header>
    <main>
      <p class="consigne"><span aria-hidden="true">🗣️</span> Dis et ⌨️ Écris</p>
      <div class="modele" id="modele"></div>
      <input
        type="text"
        id="reponse"
        autocomplete="off"
        spellcheck="false"
        autofocus
        aria-label="Écrire le son lu"
      />
      <p class="score">Score : <span class="compteur" id="compteur">0</span></p>
    </main>
  </body>
</html>
