<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apprendre à cliquer avec l'alphabet</title>
    <link rel="stylesheet" href="../../../styles.css" />
    <!-- Pas AlphaNum/styles.css (fait pour les exercices de clavier) :
         on prend la feuille de « Découvrir l'ordinateur »,
         qui a déjà le plateau, l'écran et le message de Cliquer -->
    <link rel="stylesheet" href="../../../Decouverte_ordinateur/styles.css" />
    <link rel="stylesheet" href="./cibles.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/logo-CASTJ.png"
      type="image/x-icon"
    />
    <script type="module" src="./cibles.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../../assets/Logo-CASTJ-blanc.png"
        alt="Logo du centre d'animation"
      />
      <div class="header-title">
        <h1>Centre d'animation Saint Jean</h1>
        <h2>AlphaNum</h2>
      </div>
      <div class="bas-header">
        <nav>
          <ul>
            <li>
              <a href="../../../index.html" class="bouton"
                >Retour à l'accueil</a
              >
            </li>
            <li>
              <a href="../../index.html" class="bouton">Retour à l'atelier</a>
            </li>
          </ul>
        </nav>
        <h3>Cliquer sur l'alphabet</h3>
      </div>
    </header>

    <main class="cibles">
      <div class="instructions">
        <h3 class="sous-titre">Apprendre à cliquer avec l'alphabet</h3>
        <div class="trait"></div>
      </div>

      <!-- Le plateau de jeu (styles dans Decouverte_ordinateur/styles.css) -->
      <section class="plateau">
        <div class="barre-manche">
          <p>Clique sur la lettre</p>
          <p id="compteur"></p>
        </div>

        <!-- La zone où apparaît la cible -->
        <div class="zone" id="zone">
          <!-- L'écran du début et de la fin, posé par-dessus la zone -->
          <div class="ecran" id="ecran">
            <h3 id="ecran-titre"></h3>
            <p id="ecran-texte"></p>
            <div class="ecran-boutons">
              <button type="button" class="bouton" id="ecran-bouton"></button>
            </div>
          </div>
        </div>

        <p class="message" id="message" role="status"></p>
      </section>

      <!-- La frise de l'alphabet : une case par lettre, créée par cibles.js -->
      <ol class="frise" id="frise" aria-label="Les lettres de l'alphabet"></ol>
    </main>
  </body>
</html>
